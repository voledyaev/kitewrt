<!doctype html>
<html lang="en" data-theme="kitewrt">
  <head>
    <meta charset="UTF-8" />
    <!-- Simplified kite silhouette; neutral colours follow the browser theme. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KiteWrt</title>
    <script>
      // Runs before first paint: pick the theme from the stored choice, or the
      // OS when there isn't one. Duplicated from src/theme.ts on purpose —
      // importing a module here would paint first and flip after.
      (function () {
        try {
          var v = localStorage.getItem("kitewrt-theme");
          var dark =
            v === "dark" ||
            (v !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "kitewrt" : "kitewrt-light",
          );
        } catch (e) {
          /* storage blocked: the markup's dark default stands */
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CyQlUzJ-.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B__caWSA.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
