name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed by softprops/action-gh-release to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: '0.13.9'

      - name: Install kitewrt + dev + installer deps
        run: uv sync --locked --python 3.15 --extra installer

      - name: Audit supported Python environment
        run: uv run --with pip-audit pip-audit --path .venv/lib/python3.15/site-packages --skip-editable

      - name: Run tests
        # Last-line-of-defense before publishing — never release a tag
        # whose tree's tests don't pass.
        run: uv run --locked pytest tests/

      - name: Check wheel runtime resources
        run: |
          uv build --wheel
          uv run --locked python scripts/check_wheel.py dist/*.whl

      - name: Publish release
        # No binary artifact to attach: kitewrt ships as Python source.
        # The README's install step is `git clone` + `uv sync`, so
        # the release page is just a changelog landmark.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
