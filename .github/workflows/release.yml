name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed by softprops/action-gh-release to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: '0.13.5'

      - name: Install kitewrt + dev + installer deps
        run: uv sync --locked --python 3.15 --extra installer

      - name: Run tests
        # Last-line-of-defense before publishing — never release a tag
        # whose tree's tests don't pass.
        run: uv run --locked pytest tests/

      - name: Check wheel runtime resources
        run: |
          uv build --wheel
          uv run --locked python scripts/check_wheel.py dist/*.whl

      - name: Publish release
        # No binary artifact to attach: kitewrt ships as Python source.
        # The README's install step is `git clone` + `uv sync`, so
        # the release page is just a changelog landmark.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
